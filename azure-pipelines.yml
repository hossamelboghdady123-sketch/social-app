trigger:
- main

pool:
  name: Default

stages:
- stage: Test
  displayName: Python Tests

  jobs:
  - job: PythonTests

    steps:
    - checkout: self

    - script: |
        echo "===== CURRENT DIRECTORY ====="
        pwd

        echo "===== TOP LEVEL ====="
        ls -la

        echo "===== ALL FILES ====="
        find . -maxdepth 5 -type f | sort
      displayName: Show Repository Structure