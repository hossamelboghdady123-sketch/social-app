trigger:
- main

pool:
  name: Default

stages:
- stage: Test
  displayName: Python Tests

  jobs:
  - job: PythonTests

    steps:
    - checkout: self

    - script: |
        echo "Current directory:"
        pwd

        echo "Repository files:"
        find . -maxdepth 4 -type f | sort
      displayName: Show Repository Structure

    - script: |
        python3 --version
        pip3 --version
      displayName: Check Python

    - script: |
        pip3 install -r backend/reaction-service/requirements.txt
        python3 -m py_compile backend/reaction-service/app.py
      displayName: Run Python Tests