trigger: none

pool:
  name: Default

steps:
- bash: |
    echo "############################"
    echo "MY PIPELINE IS RUNNING"
    echo "############################"

    echo "Agent:"
    echo "$AGENT_NAME"

    echo "Machine:"
    hostname

    echo "User:"
    whoami

    echo "Directory:"
    pwd

    echo "Python:"
    python3 --version

    echo "Docker:"
    docker --version

  displayName: 'TEST PIPELINE'