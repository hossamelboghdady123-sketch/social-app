trigger: none

pool:
  name: Default

steps:

- checkout: self

- bash: |
    echo "=========================="
    echo "LOCAL AGENT INFORMATION"
    echo "=========================="

    hostname
    whoami
    pwd

    echo ""
    echo "Python:"
    python3 --version

    echo ""
    echo "Docker:"
    docker --version

    echo ""
    echo "=========================="
    echo "REPOSITORY FILES"
    echo "=========================="

    find . -maxdepth 5 -type f | sort

  displayName: 'Checkout GitHub and Inspect Repository'