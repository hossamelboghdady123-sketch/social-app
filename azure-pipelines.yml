trigger: none

pool:
  name: Default

steps:

- checkout: self

- bash: |
    echo "=========================="
    echo "HELLO FROM LOCAL AGENT"
    echo "=========================="

    echo "Hostname:"
    hostname

    echo "User:"
    whoami

    echo "Current directory:"
    pwd

    echo ""
    echo "Python:"
    python3 --version

    echo ""
    echo "Docker:"
    docker --version

    echo ""
    echo "=========================="
    echo "FILES FROM GITHUB"
    echo "=========================="

    find . -maxdepth 6 -type f | sort

  displayName: 'Checkout GitHub and Show Files'